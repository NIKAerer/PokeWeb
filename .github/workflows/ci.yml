# Intégration continue : à chaque push et pull request, on vérifie que
# le backend et le frontend s'installent, passent leurs tests et se construisent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokeweb-backend
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sodium
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress

      - name: Générer des clés JWT de test (jamais commitées)
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Vérifier la configuration Symfony et le mapping Doctrine
        run: |
          php bin/console lint:container
          php bin/console doctrine:schema:validate --skip-sync

      - name: Appliquer les migrations sur une base vide
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Tests PHPUnit
        run: php bin/phpunit

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokeweb-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pokeweb-frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests Vitest
        run: npm test

      - name: Build de production
        run: npm run build
