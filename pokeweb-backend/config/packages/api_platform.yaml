api_platform:
    title: PokeWeb API
    version: 1.0.0
    # JSON simple pour le front, JSON-LD (format par défaut d'API Platform) reste disponible
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
