nelmio_cors:
    defaults:
        # Les origines autorisées viennent de CORS_ALLOW_ORIGIN (.env),
        # pour pouvoir ajouter l'URL du front en production sans toucher au code.
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'POST', 'PATCH', 'DELETE', 'OPTIONS']
        max_age: 3600
    paths:
        '^/api/': ~
